apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-platform-frontend
  template:
    metadata:
      labels:
        app: ai-platform-frontend
    spec:
      containers:
      - name: frontend
        image: ai-platform/frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ai-platform-frontend
spec:
  selector:
    app: ai-platform-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
